[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil"
version = "0.1.0"
description = "Landmark-based deterioration prediction for emergency department patients"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# ruff is PINNED, not floated. A linter that upgrades itself is a CI failure
# waiting to happen, and this repo shipped 15 red builds proving it.
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff==0.16.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["needs_data: requires the demo dataset on disk",
           "slow: spawns a subprocess"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# Pinned explicitly. Relying on the default set means a ruff release can fail
# CI on rules we never opted into, which is how this repo shipped 15 red builds.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
