name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
        continue-on-error: false
      - name: Fetch open-access demo subset
        if: always()
        run: python -m vigil.data.fetch_demo
      - name: Test
        if: always()
        run: pytest --cov=vigil --cov-report=term-missing
